# =====================================================================
# Tag display labels
# =====================================================================
# Maps internal tag slugs (used in YAML and as CSS class fragments) to
# their human-readable display labels. Used wherever tags are shown
# (people cards, publications filter pills, etc.).
#
# To add a new tag: add its slug -> label here.
# Slug rules: lowercase, no spaces, no slashes, no diacritics.
# =====================================================================

