# =====================================================================
# Public engagement activities
# =====================================================================
# Feeds the Activities list on /engagement/ (reverse-chronological).
#
# Schema:
#   date:        YYYY-MM-DD                  (required — drives ordering)
#   title:       activity title
#   type:        free text, e.g. Public lecture | School visit | Festival
#                | Workshop | Media | Exhibition
#   audience:    free text, e.g. "General public", "Schools (KS5)",
#                "Families"
#   link:        optional URL (renders a link)
#   image:       optional path, e.g. "/assets/images/engagement/foo.jpg"
#                (a placeholder thumbnail shows when empty)
#   description: optional longer text. When present, a "More" toggle
#                appears that expands an inline description.
#
# NOTE: example entries below — replace with real activities when ready.
# =====================================================================

