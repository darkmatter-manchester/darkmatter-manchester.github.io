# =====================================================================
# Presentations
# =====================================================================
# Feeds:
#   - the Recent presentations box on the home page (top 3 by date)
#   - the /research/presentations/ page (reverse-chrono, category filter)
#
# To add a talk: append a new entry. They sort automatically by date.
#
# Schema:
#   date:       YYYY-MM-DD                  (required)
#   title:      talk title
#   speaker:    name of speaker
#   venue:      conference / institution name
#   location:   "City, Country"
#   slides:     optional URL  (renders a "Slides" link)
#   recording:  optional URL  (renders a "Recording" link)
#   tags:       MUST include one category, plus optional topic tags.
#               Categories (drive the filter):
#                 research-talk   (any invited / plenary / contributed)
#                 public-lecture
#                 seminar         (departmental seminars & colloquia)
#                 poster
#               Topic tags (optional, same vocabulary as publications):
#                 darkside, phenomenology, instrumentation, quantumsensors,
#                 neutrinos, colliderphysics, mlai
#
# NOTE: example entries below — replace with the real list when ready.
# =====================================================================

