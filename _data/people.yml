# Feeds the /people/ page.
#
# Order within this file = display order on the page. Entries are
# grouped by `group:` matching keys in _data/people_groups.yml.
# Within each group, list members in reverse-chronological order of
# `start_year` (most recent first); for ties, alphabetical by surname.
#
# Schema:
#   id:          stable slug (used in HTML anchors)
#   name:        full name as displayed (UTF-8 OK — diacritics fine)
#   honorific:   "Prof." | "Dr." | ""  (rendered in muted italic)
#   surname:     for sorting reference
#   role:        full role title (e.g. "PhD student (2023–)")
#   group:       see _data/people_groups.yml for valid keys
#   start_year:  integer — year they joined the group (used for sorting
#                / future display; null for PI / postdocs if not relevant)
#   bio:         two-line research-focus paragraph. Leave "" to render
#                a soft "Research focus to come." placeholder.
#   themes:      list of tag slugs from _data/tag_labels.yml
#   experiments: list (free-form, forward-compatible — empty for now)
#   email, orcid, website, linkedin, github, bluesky: optional URLs
#   photo:       path to image, e.g. "/assets/images/people/foo.jpg".
#                Leave "" — initials placeholder shown automatically.
# =====================================================================

