# =====================================================================
# Publications
# =====================================================================
# Feeds:
#   - the Recent publications box on the home page (top 3 by date)
#   - the /research/publications/ page (reverse-chrono, year breaks,
#     tag-filter widget)
#   - each research-theme page (Recent results, filtered by the theme's
#     paper_tags from _data/research_themes.yml)
#
# To add a paper: append a new entry. They sort automatically by date.
#
# Schema:
#   date:       YYYY-MM-DD                  (required)
#   title:      paper title
#   authors:    [list of names, in order]   — layout shows all if <= 4,
#                                             otherwise "First Author et al."
#   journal:    short venue, e.g. "Phys. Rev. D" — optional for preprints
#   doi:        full DOI URL                — optional (journal links to it)
#   arxiv_id:   "2501.12345"                — optional
#   arxiv_cat:  "hep-ex" | "hep-ph" | "astro-ph.CO" | ...   — optional
#   inspire:    INSPIRE record URL          — optional (title links to it)
#   type:       published | preprint | conf-proceedings
#   tags:       free topic tags (lower-case). Vocabulary in tag_labels.yml:
#               darkside, phenomenology, instrumentation, quantumsensors,
#               neutrinos, colliderphysics, mlai
#
#   --- optional "explainer" (adds an expandable pane with a down-arrow) ---
#   explainer:           a paragraph on the key idea / result / impact.
#   explainer_image:     path to ONE key plot, e.g.
#                        "/assets/images/publications/my-plot.png"
#   explainer_image_caption: optional caption under the plot.
#   If neither explainer nor explainer_image is set, no arrow/pane appears.
#
# NOTE: the entries below are EXAMPLES to demonstrate the layout and
# filter. Replace with the real publication list when ready.
# =====================================================================

